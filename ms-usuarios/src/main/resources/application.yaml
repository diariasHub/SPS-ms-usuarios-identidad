spring:
  application:
    name: ms-usuarios
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

app:
  fhir:
    server-url: ${FHIR_SERVER_URL:http://hapi-fhir:8080/fhir}
    connect-timeout: 5s
    read-timeout: 10s
  security:
    # Defaults muy altos para dev/tests — efectivamente sin rate limit.
    # En prod se sobreescriben a valores reales (ver application-prod.yaml).
    rate-limit:
      login-attempts: 10000
      otp-attempts: 10000
      window-seconds: 60
    jwt:
      issuer: ms-usuarios
      access-token-ttl-minutes: 10
      refresh-token-ttl-hours: 8
    lockout:
      max-attempts: 5
      lock-minutes: 15
    otp:
      issuer: RedNorte-Urgencias
      digits: 6
      period-seconds: 30
      allowed-discrepancy: 1

logging:
  level:
    "[org.springframework.security]": INFO
    "[cl.rednorte.ms_usuarios]": INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-},%X{jti:-}] %logger{36} - %msg%n"
